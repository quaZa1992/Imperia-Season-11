  imp_leader_usa_inst_rep_decisions: "Institutional Republican Presidential Candidates"
  imp_leader_usa_mov_rep_decisions: "Movement Republican Presidential Candidates"
  imp_leader_usa_dis_rep_decisions: "Disruptor Republican Presidential Candidates"
  george_bush: "George W. Bush"
  john_mccain: "John McCain"
  mitt_romney: "Mitt Romney"
  alan_keyes: "Alan Keyes"
  alan_keyes_decision_desc: "A former Assistant Secretary of State for International Organizations under Reagan, Alan Keyes is a fiery conservative orator and perennial presidential candidate. With a background in diplomacy and a Ph.D. from Harvard, he brings intellectual rigor to his deeply moralistic, pro-life platform. Though he has never held elected office, his passionate defense of conservative principles has earned him a loyal following. Can this articulate outsider rally enough support to break into the political mainstream?"
  alan_keyes_desc: "Alan Keyes brings a fiercely moralistic and intellectual brand of conservatism to the presidency, rooted in his diplomatic background and religious convictions. His tenure focuses on a hawkish foreign policy, staunch social conservatism, and a vision of American renewal based on traditional values."
  steve_forbes: "Steve Forbes"
  steve_forbes_decision_desc: "The editor-in-chief of Forbes magazine and heir to a publishing fortune, Steve Forbes brings his signature "Flat Tax" proposal and supply-side economic vision to the political arena. A two-time contender for the Republican nomination, he advocates for radical tax simplification, school choice, and a return to the gold standard. Can this wealthy media executive translate his boardroom ideas into a viable national campaign?"
  steve_forbes_desc: "Steve Forbes enters the presidency as a businessman and publisher, championing supply-side economics, his iconic Flat Tax, and a platform of deregulation and monetary reform. His leadership is defined by radical tax simplification, privatization, and a foreign policy grounded in free-market advocacy."
  dick_cheney: "Dick Cheney"
  dick_cheney_decision_desc: "A veteran of multiple Republican administrations, Dick Cheney has served as White House Chief of Staff, Congressman, and Secretary of Defense before being selected as the vice-presidential nominee. Known for his deep Washington experience, conservative credentials, and steady, often hardline, hand in foreign policy, he is seen as the ultimate insider. Would a Cheney presidency be defined by pragmatism and security, or by the controversies that have followed his long career?"
  dick_cheney_desc: "Dick Cheney brings decades of Washington experience as a congressman, Defense Secretary, and White House insider to the presidency. His political identity is built on national security expertise, conservative governance, and a pragmatic, often uncompromising, approach to executive power and foreign affairs."
