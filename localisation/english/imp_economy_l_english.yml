l_english:
 imp_eco_1_dynamic_modifier: "Developed Economy"
 imp_eco_1_dynamic_modifier_desc: "\n\n\n\n£GFX_imp_developed_economy_banner\n\n\n\n\n\nDeveloped economies boast highly industrialized and diversified markets, supported by robust infrastructure, cutting-edge technology, and high standards of living. These nations are global leaders in innovation and trade, but they face challenges such as aging populations, economic inequality, and maintaining competitiveness in a rapidly changing world."
 imp_eco_2_dynamic_modifier: "Emerging Economy"
 imp_eco_2_dynamic_modifier_desc: "\n\n\n\n£GFX_imp_emerging_economy_banner\n\n\n\n\n\nSome developing economies are experiencing rapid industrialization and growth, driven by expanding infrastructure, rising incomes, and foreign investment. However, these nations face obstacles such as uneven development, volatile markets, and growing inequality. Balancing modernization with stability will determine whether they can join the ranks of the global leaders."
 imp_eco_3_dynamic_modifier: "Developing Economy"
 imp_eco_3_dynamic_modifier_desc: "\n\n\n\n£GFX_imp_developing_economy_banner\n\n\n\n\n\nNations with developing economies are grappling with widespread poverty, limited industrial capacity, and a lack of infrastructure. These economies often depend heavily on foreign aid or raw material exports, leaving them vulnerable to external shocks. Structural reforms and investments are necessary to achieve sustainable growth, but these may take time to yield results."

 imp_economy.1.t: "A New Force on the Horizon"
 imp_economy.1.d: "The world begins to take notice. Once overlooked, we are now a rising power, charting a path forward with ambition and determination. Whispers of our influence ripple through halls of diplomacy, markets react to our presence and the old powers cast wary glances in our direction. A sense of pride and purpose grows in our nation as our people feel a shift in balance and they find their oppertunities expanding by the day.\n\nThe question is no longer whether we matter, but how far we will go."
 imp_economy.1.o1: "The future is ours to shape"

 imp_economy.2.t: "A Seat at the Table"
 imp_economy.2.d: "Through almost inhuman effort and perserverance, our nation has crossed a treshold that once seemed distant, but the markers of progress are undeniable. Prosperity is spreading, our industries are thriving and diversifying and our influence is resonating far beyond our own borders. No longer does the world perceive us as a nation that is striving to catch up, but instead as one that drives global innovation and trade.\n\nThe challenge now is to define what comes next."
 imp_economy.2.o1: "We have arrived where we belong"

 imp_economy.3.t: "Mounting Debt Concerns"
 imp_economy.3.d: "Economists are sounding the alarm as the national currency has begun to devalue amid growing debt concerns. The rising cost of imports is fueling inflation, leaving households and businesses struggling to keep up. Some are calling for urgent action to stabilize the economy, while others fear this is just the beginning of a deeper financial crisis."
 imp_economy.3.o1: "That sounds like a problem for the next government"
 imp_economy.3.o2: "We could cut healthcare spending"
 imp_economy.3.o3: "We could cut social spending"
 imp_economy.3.o4: "We could cut education spending"

 imp_economy.4.t: "Our Debt is Piling up"
 imp_economy.4.d: "Key figures in our government are raising the issue of our national currency having begun to devalue amid growing debt concerns. The rising debt is causing inflation rates to rise, making it harder for us to keep financing our programs. Some experts are calling for urgent action to stabilize the economy, while others tell us this is just the beginning of a deeper financial crisis."
 imp_economy.4.o1: "We'll think of something"
 imp_economy.4.o2: "Cut healthcare spending"
 imp_economy.4.o3: "Cut social spending"
 imp_economy.4.o4: "Cut education spending"

 imp_economy.5.t: "Debt Reaches Unsustainable Levels!"
 imp_economy.5.d: "Economists have declared the nation's debt unsustainable, now exceeding 200% of GDP. Interest payments alone consume a massive portion of the budget, leaving little room for critical public services. Calls for drastic reforms grow louder as the government teeters on the brink of financial collapse."
 imp_economy.5.o1: "There's nothing we can do about this right now"
 imp_economy.5.o2: "We will cut healthcare spending immediately"
 imp_economy.5.o3: "We will cut social spending immediately"
 imp_economy.5.o4: "We will cut education spending immediately"

 imp_economy.6.t: "Debt puts Regime Under Pressure!"
 imp_economy.6.d: "With debt surpassing 200% of GDP, the government faces an unprecedented fiscal crisis. Despite its grip, dissent is bubbling under the surface as living standards decline. Critics within the regime's inner circle are calling for drastic measures to stabilize the economy, before we lose control."
 imp_economy.6.o1: "Debt is just a number, right?"
 imp_economy.6.o2: "Cut healthcare spending"
 imp_economy.6.o3: "Cut social spending"
 imp_economy.6.o4: "Cut education spending"

 imp_economy.7.t: "Opposition Pushes for Ambitious Social Spending"
 imp_economy.7.d: "With the national debt at an impressively low level, the opposition has seized the moment to call for increased spending on healthcare and social programs. Framing it as a moral imperative and a unique opportunity to improve the lives of citizens, their proposals have garnered significant public attention."
 imp_economy.7.o1: "Let them promise what they want"
 imp_economy.7.o2: "We'll invest in healthcare"
 imp_economy.7.o3: "We'll invest in pensions"
 imp_economy.7.o4: "We'll invest in education"
 imp_economy.7.o5: "Let's upgrade our infrastructure"

 imp_economy.8.t: "Internal Push for Reform"
 imp_economy.8.d: "With the national debt reaching historically low levels, influential figures within the regime's upper echelons have begun lobbying for increased investments in their fields. Ministers and advisors argue that the government now has the financial breathing room to demonstrate its commitment to the population’s well-being, solidifying public loyalty and trust."
 imp_economy.8.o1: "Vultures... it's all mine"
 imp_economy.8.o2: "We'll invest in healthcare"
 imp_economy.8.o3: "We'll invest in pensions"
 imp_economy.8.o4: "We'll invest in education"
 imp_economy.8.o5: "Let's upgrade our infrastructure"
