 GLOBALISM_TOOLTIP: "§HGlobalism§! represents how deeply our nation is integrated into the global economy. A higher value increases benefits from interacting with foreign markets and boosts our economic efficiency through the benefits of comparitive advantage. At the same time it also increases our vulnerability to global crisis, sanctions and foreign influence.\n\nAs our market adjusts to new developments, our §HGlobalization§! will tick towards its equilibrium value at a rate of §G[?globalism_value_rate|.2]§! per week.\n\nCurrent §HGlobalization§! Equilibrium: §H[?globalism_value_eq]§!\nCurrent §HGlobalization§! Level: §H[?globalism_value]§!\n\nWe gain the following effects from our level of §HGlobalization§!:\nWar Support: [?imp_globalism_mod_warsup|%+]\nProductivity Growth: [?imp_globalism_mod_prod|.2+]\nSanction Resistance: [?imp_globalism_mod_sancres|%+]\nSanction Effectiveness: [?imp_globalism_mod_sanceff|%+]\nReturn on Investment: [?imp_globalism_mod_roi|%+]\nInterest Rates: [?imp_globalism_mod_int|.2-]\nReceiving Investment Duration: [?imp_globalism_mod_inv|%-]\nOutgoing Investment Duration: [?imp_globalism_mod_inv|%-]\nForeign Influence Defense: [?imp_globalism_mod_inv|%+]"
