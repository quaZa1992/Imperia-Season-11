 imp_treasury_misalignment: "Treasury Misalignment"
 imp_treasury_misalignment_desc: "A growing imbalance between government revenue and expenditure has led to an accumulation of idle capital. With spending unable to keep pace with incoming funds, the surplus sits underutilized, slowing economic circulation and gradually eroding future tax income. Without fiscal realignment, the treasury risks becoming a drag on growth rather than a safeguard of stability.\n\n§HMaking sure that our budget is balanced, our borrowing capacity isn't too high, as well as preventing a large build-up of funds in our treasury, will depreciate the penalties from this spirit gradually over time.§!"
 imp_investment_in_extra: "Additional Incoming Investment Slots"
 imp_investment_out_extra: "Additional Outgoing Investment Slots"
 imp_investment_reward: "Incoming Investment Extra Reward"
 imp_investment_target: "Investment Target"
 imp_investment_target_desc: "Our nation serves as a beacon of economic opportunity in the world. International corporations and financial institutions are eager to pour resources into our markets, fueling rapid economic expansion and technological development."

 imp_economy.9.t: "Moody's considers downgrade"
 imp_economy.9.d: "Following a recent reduction in foreign-held bonds, international credit rating agency Moody’s has issued a notice placing our national credit outlook under review. While this falls short of a formal downgrade, the warning has already unsettled financial markets and prompted concern among investors. With insecurity about our solvency running rampant on financial markets, it's temporarily harder to borrow money."
 imp_economy.9.o1: "Let them watch."
 imp_interest_rates: "Solvency Issues"
 imp_interest_rates_desc: "It's harder to borrow money because of recent events."

 imp_economy.10.t: "Whispers of currency overvaluation?"
 imp_economy.10.d: "A series of quiet reports from international financial institutions and trading desks have begun circulating the idea that our national currency may be overvalued relative to market fundamentals. While we haven't issued a response yet, traders, analysts, and politicians are beginning to murmur."
 imp_economy.10.o1: "Let the market talk."
 imp_economy.10.o2: "Issue a formal statement."

 imp_economy.11.t: "Capital flight accelerates"
 imp_economy.11.d: "The recent bond sell-off by foreign holders has triggered a sharp shift in investor behavior. Capital outflows are accelerating as banks, hedge funds, and private investors rapidly move money offshore to avoid potential devaluation or further instability. Domestic financial institutions are now warning of liquidity stress and the national currency is weakening by the hour, and media coverage has begun to stir panic in both business and consumer sectors."
 imp_economy.11.o1: "Raise interest rates!"
 imp_economy.11.o2: "Let it burn!"
 imp_interest_rates_mega: "Extreme Solvency Issues"
 imp_interest_rates_mega_desc: "It's almost impossible to borrow money because of recent events."

 imp_economy.12.t: "Elites panic behind closed doors"
 imp_economy.12.d: "After the large-scale bond sell-off, confidential reports are emerging of escalating concern among senior officials, technocrats, and financial elites. High-ranking bureaucrats have quietly begun contingency planning — drawing up scenarios for mass capital outflows, emergency reserve use, or even international stabilization talks. Some factions are even exploring policy changes without leadership approval."
 imp_economy.12.o1: "Tighten Internal Control"
 imp_economy.12.o2: "Ignore the chatter."