 germany_party.100: "Creation of Die Linke"
 germany_party.100.t: "Creation of Die Linke"
 germany_party.100.d: "Die Linke (The Left) is the direct descendant of the ruling party of former East Germany, the Socialist Unity Party of Germany, who merged with other left-wing democratic socialist parties to expand it's electoral base beyond it's stronghold in eastern Germany. Die Linke combines left-wing policies such as increased spending on welfare with populist rhetoric. They want Germany out of NATO and wish to include Russia in a European security framework."