 # Imperia <-> Millennium Dawn 2.0.2 integration: overrides of MD 2.0.2 keys reflecting Imperia mechanics
 POPULATION_TAX_RATE_TT:0 "Population Tax Rate includes all of the taxes imposed on the public. This can include but is not limited to income tax, VAT taxes, sales tax, and property taxes.\n\n§YModifiers from Population Taxes:§!\n£stability_texticon  Stability: [?stability_factor_from_population_tax|%+]\n§YHealthcare Expectations:§! +[?expectations_from_pop_tax]\n§YEducation Expectations:§! +[?expectations_from_pop_tax]\n§YWelfare Expectations:§! +[?expectations_from_pop_tax]"
 total_agriculture_district_amount_tt_delayed:0 "§YCommercialized Agriculture Districts§! represents a catch-all for all non-subsistence Agriculture within our nation. It includes Agro-Industry, arable land, grain silos, butcherhouses and more.\n\nProvides the state with:\nBase Number of Required Workers: §Y188K§!\nBase GDP Output per §YCommercialized Agriculture District§!: $§Y15 Billion§!\nBase Energy Consumption: §R-0.10§! GW\n§YFuel Gain§! from States: 8\n§YLocal Supplies§!: 1.5%\n\nGDP per Capita impact on §YWorkforce§!: [?worker_requirement_gdp_multiplier_display|-%1]\nLaw, National Spirits and Tech impact on §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, National Spirits and Tech impact on §YCommercialized Agriculture Districts Workforce§!: [?modifier@agriculture_district_worker_requirement_modifier|-%0]\nCombined reductions are capped at §Y90%§!.\n\nWorkers Required per §YCommercialized Agriculture District§!: [?workers_per_agriculture_district_display|2]K\n"
 INT_INVESTMENTS_TOOLTIP:0 "We have $[?int_investments|3] §Hbillion§! in international investments.\nWe hold $[?imp_total_bonds_held|3] §Hbillion§! in sovereign bonds (25% of them count towards investment returns).\nWe will gain [?roi_rate|%0] §HReturn on Investment§! on this each year, generating $[?int_investments_rate|3] §Hbillion§! weekly. $[?int_investments_collected_rate|3] §Hbillion§! goes to the treasury. $[?int_investments_reinvest_rate|3] §Hbillion§! is reinvested.\nCurrent Active §YInvestment Projects§!: [?active_projects|0]/15"
 DEBT_TOOLTIP:0 "§YTotal Debt§!: $[?debt|3] §Ybillion§!\n§YTotal Bonds Owed§!: $[?imp_total_bonds_owed|3] §Ybillion§!\n§YInterest Rate§!: [?interest_rate|2]%\n§YDebt-to-GDP§! Ratio: §Y[?debt_ratio|-%1]§!\n§YInterest on Debt§!: $[?debt_rate|-3] §Ybillion§!\n[debt_fx_factor_line][debt_automatic_repayment_toggled]"
